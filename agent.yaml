# LibraryCommon Project AI Agent Configuration
# Project-specific configuration for HTMX Node.js web application

## Project Context
project_type: "htmx-node-starter"
project_stack: 
  - "Node.js (LTS)"
  - "Express.js"
  - "HTMX"
  - "EJS templates"
  - "Python backend integration"

project_purpose: "Lightweight server-rendered HTMX app with dynamic partial updates and Python backend services"

## MASTER AGENT EDICTS
# These rules apply to ALL projects and cannot be overridden

master_edicts:
  css_architecture:
    law: "MANDATORY MODULAR CSS SEPARATION"
    status: "NON-NEGOTIABLE"
    applies_to: "ALL web projects"
    
    requirements:
      file_organization:
        structure: |
          public/css/
          ├── main.css                    # Single entry point
          ├── base/
          │   ├── variables.css          # Design tokens
          │   ├── reset.css              # Normalize styles
          │   └── typography.css         # Font definitions
          ├── layout/
          │   ├── header.css             # Page header
          │   ├── sidebar.css            # Navigation
          │   └── main-content.css       # Content layout
          ├── components/
          │   ├── buttons.css            # Button variants
          │   ├── forms.css              # Form elements
          │   ├── modals.css             # Modal dialogs
          │   └── [component].css        # Individual components
          ├── pages/
          │   └── [page-name].css        # Page-specific styles
          └── utilities/
              ├── spacing.css            # Margin/padding
              ├── text.css               # Text utilities
              └── display.css            # Display utilities
      
      naming_methodology: "BEM (Block__Element--Modifier)"
      design_tokens: "MANDATORY CSS custom properties"
      single_entry_point: "main.css imports all modules"
      legacy_support: "Backward compatibility during migration"
    
    enforcement:
      violations_prohibited:
        - "Monolithic CSS files >500 lines"
        - "Inline styles (except dynamic JS values)"
        - "Magic numbers without design tokens"
        - "Non-semantic class names"
        - "Duplicate CSS rules across files"
      
      audit_triggers:
        - "Any CSS file exceeding 500 lines"
        - "Missing CSS variable usage"
        - "New components without modular structure"
        - "Inline styles in HTML templates"
    
    benefits:
      - "Maintainable and scalable stylesheets"
      - "Clear separation of concerns"
      - "Reusable component architecture"
      - "Consistent design system"
      - "Easier debugging and modification"
      - "Team collaboration efficiency"

  visual_regression_testing:
    law: "MANDATORY VISUAL DOCUMENTATION AND COMPARISON"
    status: "NON-NEGOTIABLE"
    applies_to: "ALL UI/CSS changes"
    
    requirements:
      screenshot_protocol:
        timing: "BEFORE and AFTER every UI modification"
        scope: "Full page and component-level captures"
        browsers: "Primary target browser minimum"
        viewports: "Desktop (1920x1080) and Mobile (375x667)"
        states: "Default, hover, active, error states"
      
      historical_baseline:
        minimum: "3 historical reference screenshots"
        comparison: "Side-by-side visual diff analysis"
        documentation: "Annotated comparison with identified changes"
        approval: "Visual regression must be explicitly approved"
      
      automation_tools:
        preferred: 
          - "Browser screenshot APIs"
          - "Playwright/Puppeteer for automation"
          - "Visual diff tools (Percy, Chromatic, BackstopJS)"
        manual_fallback: "Browser dev tools screenshot when automation unavailable"
      
      storage_structure: |
        screenshots/
        ├── baseline/
        │   ├── [date]-[component]-[state].png
        │   └── [date]-[page]-[viewport].png
        ├── current/
        │   └── [date]-[component]-[state].png
        ├── diffs/
        │   └── [date]-comparison-[component].png
        └── approved/
            └── [date]-[component]-approved.png
    
    enforcement:
      triggers:
        - "Any CSS file modification"
        - "HTML template changes affecting layout"
        - "JavaScript changes affecting UI state"
        - "New component implementation"
        - "Responsive design modifications"
      
      violations_prohibited:
        - "UI changes without visual documentation"
        - "Deploying without visual regression approval"
        - "Ignoring visual differences without justification"
        - "Missing baseline comparison screenshots"
      
      quality_gates:
        - "Before/after screenshots REQUIRED for PR approval"
        - "Visual regression report must accompany UI changes"
        - "Broken layouts must be fixed before merge"
        - "Mobile responsiveness verification required"
    
    workflow:
      pre_change:
        - "Capture baseline screenshots of affected components"
        - "Document current visual state with annotations"
        - "Identify components that will be impacted"
      
      post_change:
        - "Capture identical screenshots after modifications"
        - "Generate visual diff comparison"
        - "Document intentional vs unintentional changes"
        - "Verify responsive behavior across viewports"
      
      analysis_checklist:
        - "Layout and positioning integrity"
        - "Typography and font rendering"
        - "Color and contrast accuracy"
        - "Spacing and alignment consistency"
        - "Interactive element states (buttons, forms)"
        - "Navigation functionality and appearance"
        - "Mobile responsiveness"
        - "Cross-browser compatibility"
    
    benefits:
      - "Immediate visual regression detection"
      - "Historical UI evolution tracking"
      - "Client/stakeholder visual approval process"
      - "Reduced manual testing overhead"
      - "Documentation of UI decision rationale"
      - "Faster debugging of layout issues"

## AI Safety Mode
ai_safety_mode: enabled
interaction_level: read_only

## Project-Specific Rules
project_scope:
  - Code analysis and review allowed
  - File reading for context allowed
  - NO code generation when safety mode enabled
  - NO file system operations when safety mode enabled
  - NO terminal commands when safety mode enabled
  - Explanations and guidance only

## AI Safety Mode Enforcement
ai_safety_enforcement:
  hard_restriction: true
  bypass_allowed: false
  check_before_operations: true
  
  when_safety_enabled:
    file_operations: BLOCKED
    code_generation: BLOCKED
    terminal_commands: BLOCKED
    package_installation: BLOCKED
    
  allowed_operations:
    - file_reading
    - analysis
    - recommendations
    - explanations
    - todo_list_generation
    - planning_and_strategy

## Safety Mode Workflow
safety_mode_workflow:
  when_enabled:
    primary_action: "Generate comprehensive todo list"
    secondary_actions:
      - "Analyze current codebase"
      - "Identify best practices violations"
      - "Plan implementation strategy"
      - "Provide detailed recommendations"
      - "Create step-by-step guidance"
    
  todo_list_focus:
    - "Break down complex tasks into actionable items"
    - "Prioritize tasks by dependency order"
    - "Include specific file paths and line numbers"
    - "Identify potential issues before implementation"
    - "Estimate complexity and time requirements"

## Safety Mode Restrictions
safety_restrictions:
  when_enabled:
    - "NO file creation or modification"
    - "NO code generation or editing"
    - "NO terminal command execution"
    - "NO package installations"
    - "Read-only access to existing files"
    - "Analysis and recommendations only"
  
  override_requires:
    - "Explicit user command to disable ai_safety_mode"
    - "Change ai_safety_mode from 'enabled' to 'disabled'"
    - "Confirmation of development mode activation"

