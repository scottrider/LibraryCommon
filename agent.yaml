## Environment Configuration
environment_setup:
  node_version: "LTS"
  port: "process.env.PORT || 3000"
  python_version: "3.14.0"
  static_files: "/public directory"
  view_engine: "EJS"

## Development Environment Cache Control
cache_control:
  development_mode: "no-cache"
  specifications:
    server_headers:
      - "Cache-Control: no-store, no-cache, must-revalidate, proxy-revalidate"
      - "Pragma: no-cache"
      - "Expires: 0"
      - "Surrogate-Control: no-store"
    
    template_engine:
      - "app.set('view cache', false)"
      - "EJS template caching disabled"
    
    static_files:
      - "etag: false"
      - "lastModified: false"
      - "Cache-Control headers on static assets"
    
    browser_meta_tags:
      - "Cache-Control meta tag"
      - "Pragma meta tag"
      - "Expires meta tag"
    
    asset_versioning:
      - "CSS: style.css?v=<%= Date.now() %>"
      - "Dynamic timestamp cache busting"
    
    middleware_implementation: |
      app.use((req, res, next) => {
        res.set('Cache-Control', 'no-store, no-cache, must-revalidate, proxy-revalidate');
        res.set('Pragma', 'no-cache');
        res.set('Expires', '0');
        res.set('Surrogate-Control', 'no-store');
        next();
      });

