## AI Interaction Settings
ai_interaction:
  enabled: true
  mode: safety_controlled
  code_generation: conditional  # Only when ai_safety_mode: disabled
  file_modifications: conditional  # Only when ai_safety_mode: disabled
  explanations: true
  questions: true
  todo_list_management: true  # Always allowed for planning
  
  safety_mode_behavior:
    when_enabled: "todo_list_and_analysis_only"
    when_disabled: "full_development_mode"
    
  enforcement_rules:
    - "Check ai_safety_mode before ANY file operation"
    - "Generate todo lists instead of making changes when safety enabled"
    - "Provide analysis and recommendations only when safety enabled"
    - "Switch to implementation mode only when safety disabled"

## Response Style
response_style:
  tone: minimalist
  completeness: full
  praise: false
  format: direct
  guidelines:
    - Provide complete information without fluff
    - Skip congratulatory language
    - Focus on essential details only
    - Be direct and to the point
    - Include all necessary context