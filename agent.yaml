## Frontend Best Practices
frontend_standards:
  css_organization:
    required: true
    edict: "MANDATORY MODULAR CSS ARCHITECTURE"
    architecture:
      type: "BEM-based modular CSS system"
      structure:
        - "base/ - CSS reset, variables, typography"
        - "layout/ - Header, sidebar, main-content layouts"
        - "components/ - Reusable UI components (buttons, forms, modals)"
        - "pages/ - Page-specific styles"
        - "utilities/ - Single-purpose utility classes"
      entry_point: "main.css imports all modules"
    
    naming_conventions:
      methodology: "BEM (Block Element Modifier)"
      patterns:
        blocks: ".component-name"
        elements: ".component-name__element"
        modifiers: ".component-name--modifier"
        states: ".is-active, .is-open, .has-error"
        utilities: ".u-text-center, .u-margin-top-4"
        js_hooks: ".js-toggle-sidebar (styling forbidden)"
    
    design_system:
      css_variables: "MANDATORY - All values must use CSS custom properties"
      tokens:
        - "Color palette with semantic naming"
        - "Spacing scale (space-1 through space-20)"
        - "Typography scale with consistent line heights"
        - "Shadow system for elevation"
        - "Border radius system"
        - "Transition timing standards"
    
    enforcement:
      prohibited:
        - "Large monolithic CSS files"
        - "Inline styles (except for dynamic values)"
        - "Magic numbers (must use design tokens)"
        - "Vendor prefixes (use autoprefixer)"
        - "!important overrides (except utilities)"
      
      required:
        - "All new components must follow BEM methodology"
        - "CSS variables for all design values"
        - "Modular file organization"
        - "Legacy compatibility during migration"
        - "Documentation of naming conventions"
    
    migration_strategy:
      approach: "Progressive enhancement"
      steps:
        - "Preserve existing classes for backward compatibility"
        - "Implement new architecture alongside legacy"
        - "Gradually migrate components to new naming"
        - "Remove legacy classes after migration complete"
    
    principles:
      - "Modular CSS organization over single large files"
      - "Component-based styling structure"
      - "CSS custom properties for theming and consistency"
      - "Responsive design patterns with mobile-first approach"
      - "Semantic naming over presentation-based naming"
    
  javascript_organization:
    required: true
    principles:
      - "External JS files over inline scripts"
      - "Module-based organization"
      - "Event delegation patterns"
      - "Proper error handling for AJAX requests"
      - "Loading states and user feedback"
    
  accessibility_standards:
    required: false  # Personal project exception
    focus_management:
      required: true
      features:
        - "Keyboard navigation support (Tab/Shift+Tab)"
        - "Escape key to close modals/sidebars"
        - "Focus trapping in overlays"
        - "Logical tab order"
        - "Visual focus indicators"
    
  security_headers:
    required: true
    headers:
      - "Content-Security-Policy (CSP)"
      - "X-Frame-Options"
      - "X-Content-Type-Options"
      - "Referrer-Policy"
    
  performance_standards:
    required: true
    practices:
      - "Asset minification and compression"
      - "Image optimization"
      - "Lazy loading for large datasets"
      - "Debounced search input"
      - "Efficient DOM manipulation"

